name: splinehmr
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - pip:
      - -r requirements.txt

# Notes:
# - This file captures the lightweight Python side of the SplineHMR demo.
# - Install CUDA-compatible PyTorch and PyTorch3D before `pip install -r requirements.txt`,
#   or use the validated deployment path in docs/DEPLOYMENT.md:
#     conda create -n splinehmr --clone gvhmr -y
